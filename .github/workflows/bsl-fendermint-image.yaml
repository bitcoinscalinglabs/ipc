# Builds the fendermint image (fendermint, ipc-cli, actor bundles, contract ABIs) from the
# `bitcoin` branch and pushes it to GHCR. 
# amd64 only.
name: bsl-fendermint image

on:
  push:
    branches: [bitcoin]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: bsl-fendermint-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/bitcoinscalinglabs/bsl-fendermint
  CARGO_INCREMENTAL: '0'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          rust: 1.85.0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Actor bundles and contract ABIs that the runner image copies in.
      - name: Docker deps (bundles + ABIs)
        run: |
          cd contracts && ln -sf contracts src && cd ..
          cd fendermint && make docker-deps

      - name: Build and push
        run: |
          cd fendermint
          cat docker/builder.ci.Dockerfile docker/runner.Dockerfile > docker/Dockerfile
          docker buildx build \
            --push \
            --platform linux/amd64 \
            --cache-from=type=gha --cache-to=type=gha,mode=max \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -f docker/Dockerfile \
            -t "$IMAGE:testnet" \
            -t "$IMAGE:${GITHUB_SHA::10}" \
            ..

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:testnet"
