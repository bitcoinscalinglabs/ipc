[package]
name = "ipc-eots"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
publish = false

[dependencies]
hex = { workspace = true }
k256 = { version = "0.13", features = ["schnorr", "arithmetic"] }
serde = { workspace = true }
sha2 = { workspace = true }
